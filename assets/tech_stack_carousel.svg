<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1836" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#04060e" stop-opacity="1"/>
    </radialGradient>
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes marqueeLeft {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes marqueeRight {
      0% { transform: translateX(-50%); }
      100% { transform: translateX(0); }
    }
    .track-row1 {
      display: flex;
      width: 200%;
      animation: marqueeLeft 18s linear infinite;
    }
    .track-row2 {
      display: flex;
      width: 200%;
      animation: marqueeRight 18s linear infinite;
    }
    .tech-card {
      background: rgba(13, 26, 58, 0.7);
      border: 1px solid rgba(0, 240, 255, 0.35);
      border-radius: 12px;
      padding: 6px 16px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 8px;
      box-shadow: 0 4px 15px rgba(0, 240, 255, 0.1);
    }
    .tech-text {
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .tag-cyan { color: #00f0ff; }
    .tag-purple { color: #bd00ff; }
    .tag-green { color: #00ff88; }
    .tag-yellow { color: #ffd700; }
  </style>

  <rect width="900" height="180" rx="16" fill="url(#bgGrad)" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1.5"/>

  <text x="450" y="26" fill="#00f0ff" font-family="Orbitron, Segoe UI, sans-serif" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">
    ⚡ 3D INTERACTIVE TECH RADAR &amp; ARCHITECTURE ⚡
  </text>

  <foreignObject x="10" y="42" width="880" height="125">
    <div xmlns="http://www.w3.org/1999/xhtml" style="overflow: hidden; width: 100%; height: 100%;">
      <!-- Row 1 (Moving Left) -->
      <div class="track-row1" style="white-space: nowrap; margin-bottom: 12px;">
        <span class="tech-card"><span class="tag-cyan">🐍</span> <span class="tech-text">Python 3.14</span></span>
        <span class="tech-card"><span class="tag-cyan">⚡</span> <span class="tech-text">FastAPI Engine</span></span>
        <span class="tech-card"><span class="tag-purple">⚛️</span> <span class="tech-text">Next.js 14 App Router</span></span>
        <span class="tech-card"><span class="tag-cyan">🤖</span> <span class="tech-text">Google Gemini AI</span></span>
        <span class="tech-card"><span class="tag-green">🎙️</span> <span class="tech-text">Neural TTS (Jasper)</span></span>
        <span class="tech-card"><span class="tag-yellow">📘</span> <span class="tech-text">TypeScript</span></span>
        <span class="tech-card"><span class="tag-cyan">🐳</span> <span class="tech-text">Docker &amp; Compose</span></span>
        <span class="tech-card"><span class="tag-purple">🐘</span> <span class="tech-text">PostgreSQL</span></span>
        <span class="tech-card"><span class="tag-green">⚡</span> <span class="tech-text">Redis Cache</span></span>
        <!-- Duplicated for seamless loop -->
        <span class="tech-card"><span class="tag-cyan">🐍</span> <span class="tech-text">Python 3.14</span></span>
        <span class="tech-card"><span class="tag-cyan">⚡</span> <span class="tech-text">FastAPI Engine</span></span>
        <span class="tech-card"><span class="tag-purple">⚛️</span> <span class="tech-text">Next.js 14 App Router</span></span>
        <span class="tech-card"><span class="tag-cyan">🤖</span> <span class="tech-text">Google Gemini AI</span></span>
        <span class="tech-card"><span class="tag-green">🎙️</span> <span class="tech-text">Neural TTS (Jasper)</span></span>
        <span class="tech-card"><span class="tag-yellow">📘</span> <span class="tech-text">TypeScript</span></span>
        <span class="tech-card"><span class="tag-cyan">🐳</span> <span class="tech-text">Docker &amp; Compose</span></span>
        <span class="tech-card"><span class="tag-purple">🐘</span> <span class="tech-text">PostgreSQL</span></span>
        <span class="tech-card"><span class="tag-green">⚡</span> <span class="tech-text">Redis Cache</span></span>
      </div>

      <!-- Row 2 (Moving Right) -->
      <div class="track-row2" style="white-space: nowrap;">
        <span class="tech-card"><span class="tag-yellow">💳</span> <span class="tech-text">UzPayment FinTech SDK</span></span>
        <span class="tech-card"><span class="tag-cyan">🌐</span> <span class="tech-text">WebSockets (Socket.io)</span></span>
        <span class="tech-card"><span class="tag-purple">🎨</span> <span class="tech-text">Tailwind CSS 3D</span></span>
        <span class="tech-card"><span class="tag-green">📡</span> <span class="tech-text">PulseAPI Monitoring</span></span>
        <span class="tech-card"><span class="tag-cyan">📦</span> <span class="tech-text">SQLite WAL Sentinel</span></span>
        <span class="tech-card"><span class="tag-yellow">🤖</span> <span class="tech-text">Voice2Deal AI Bot</span></span>
        <span class="tech-card"><span class="tag-purple">🐧</span> <span class="tech-text">Linux Ubuntu VPS</span></span>
        <span class="tech-card"><span class="tag-cyan">🔄</span> <span class="tech-text">Git &amp; GitHub Actions</span></span>
        <!-- Duplicated for seamless loop -->
        <span class="tech-card"><span class="tag-yellow">💳</span> <span class="tech-text">UzPayment FinTech SDK</span></span>
        <span class="tech-card"><span class="tag-cyan">🌐</span> <span class="tech-text">WebSockets (Socket.io)</span></span>
        <span class="tech-card"><span class="tag-purple">🎨</span> <span class="tech-text">Tailwind CSS 3D</span></span>
        <span class="tech-card"><span class="tag-green">📡</span> <span class="tech-text">PulseAPI Monitoring</span></span>
        <span class="tech-card"><span class="tag-cyan">📦</span> <span class="tech-text">SQLite WAL Sentinel</span></span>
        <span class="tech-card"><span class="tag-yellow">🤖</span> <span class="tech-text">Voice2Deal AI Bot</span></span>
        <span class="tech-card"><span class="tag-purple">🐧</span> <span class="tech-text">Linux Ubuntu VPS</span></span>
        <span class="tech-card"><span class="tag-cyan">🔄</span> <span class="tech-text">Git &amp; GitHub Actions</span></span>
      </div>
    </div>
  </foreignObject>
</svg>