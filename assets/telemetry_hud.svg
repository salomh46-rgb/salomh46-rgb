<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="110">
  <defs>
    <!-- Obsidian Radial Background -->
    <radialGradient id="hudBg" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#080e22"/>
      <stop offset="50%" stop-color="#040714"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>

    <!-- Glowing Cybernetic Borders -->
    <linearGradient id="hudBorderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Scanline Laser -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes hudPulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes laserSweep {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(900px); }
    }
    @keyframes beaconBlink {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.3); opacity: 1; }
    }
    .hud-beacon {
      animation: beaconBlink 2s ease-in-out infinite;
      transform-origin: center;
    }
  </style>

  <!-- HUD Container Card -->
  <rect x="2" y="2" width="896" height="106" rx="14" fill="url(#hudBg)" stroke="url(#hudBorderGrad)" stroke-width="1.6"/>

  <!-- Scanning Laser Line Across Top -->
  <g style="clip-path: inset(0 0 0 0 round 14px);">
    <rect y="2" width="280" height="2" fill="url(#laserGrad)" style="animation: laserSweep 4.5s linear infinite;"/>
  </g>

  <!-- Corner Tech Reticles -->
  <path d="M12,12 L24,12 M12,12 L12,24" stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.75"/>
  <path d="M888,12 L876,12 M888,12 L888,24" stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.75"/>
  <path d="M12,98 L24,98 M12,98 L12,86" stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.75"/>
  <path d="M888,98 L876,98 M888,98 L888,86" stroke="#00f0ff" stroke-width="1.8" fill="none" opacity="0.75"/>

  <!-- ================= MODULE 1: SYSTEM ARCHITECTURE ================= -->
  <g transform="translate(32, 24)">
    <g transform="translate(0, 8)">
      <circle cx="6" cy="6" r="4" fill="#00f0ff" class="hud-beacon"/>
      <circle cx="6" cy="6" r="8" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>
    </g>
    <text x="24" y="10" fill="#94a3b8" font-family="'Orbitron', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">TELEMETRY // PROTOCOL</text>
    <text x="24" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="0.5">
      5-Step Architecture
    </text>
    <text x="24" y="52" fill="#00f0ff" font-family="'Orbitron', sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">
      STATUS: NOMINAL 100%
    </text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="245" y1="20" x2="245" y2="90" stroke="#334155" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- ================= MODULE 2: CONCURRENCY & RACE DEFENSE ================= -->
  <g transform="translate(265, 24)">
    <text x="0" y="10" fill="#94a3b8" font-family="'Orbitron', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">RACE CONDITION DEFENSE</text>
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="0.5">
      Atomic Mutex Locks
    </text>
    <text x="0" y="52" fill="#38bdf8" font-family="'Orbitron', sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">
      ZERO-REGRESSION GUARD
    </text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="475" y1="20" x2="475" y2="90" stroke="#334155" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- ================= MODULE 3: MULTI-TENANT ISOLATION ================= -->
  <g transform="translate(495, 24)">
    <text x="0" y="10" fill="#94a3b8" font-family="'Orbitron', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">DATA PARTITIONING</text>
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="0.5">
      Multi-Tenant Isolation
    </text>
    <text x="0" y="52" fill="#a855f7" font-family="'Orbitron', sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">
      ZERO CROSS-LEAKAGE
    </text>
  </g>

  <!-- Vertical Divider 3 -->
  <line x1="695" y1="20" x2="695" y2="90" stroke="#334155" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- ================= MODULE 4: ORBITAL GEO-NODE ================= -->
  <g transform="translate(715, 24)">
    <text x="0" y="10" fill="#94a3b8" font-family="'Orbitron', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="1.5">PRIMARY TIME-NODE</text>
    <text x="0" y="32" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" letter-spacing="0.5">
      Tashkent 🇺🇿 UTC+5
    </text>
    <text x="0" y="52" fill="#f59e0b" font-family="'Orbitron', sans-serif" font-size="9.5" font-weight="800" letter-spacing="1">
      LATENCY: &lt;15ms // TLS 1.3
    </text>
  </g>
</svg>
