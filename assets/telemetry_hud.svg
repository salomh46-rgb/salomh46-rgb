<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 110" width="100%" height="110">
  <defs>
    <!-- Deep Obsidian Radial Background -->
    <radialGradient id="hudBg" cx="50%" cy="50%" r="85%">
      <stop offset="0%" stop-color="#0c0e15"/>
      <stop offset="50%" stop-color="#06070a"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <!-- Champagne Gold Accent Gradient -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#FFEBB0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Subtle Hairline Beam -->
    <linearGradient id="goldLaser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5D77F" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes laserSweep {
      0% { transform: translateX(-900px); }
      100% { transform: translateX(900px); }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    .beacon {
      animation: pulseAura 2.5s ease-in-out infinite;
    }
  </style>

  <!-- HUD Container Card -->
  <rect x="2" y="2" width="896" height="106" rx="16" fill="url(#hudBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2"/>

  <!-- Scanning Hairline Stream Line Across Top -->
  <g style="clip-path: inset(0 0 0 0 round 16px);">
    <rect y="2" width="260" height="1.6" fill="url(#goldLaser)" style="animation: laserSweep 5s linear infinite;"/>
  </g>

  <!-- Subtle Corner Reticles -->
  <path d="M14,14 L24,14 M14,14 L14,24" stroke="#D4AF37" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M886,14 L876,14 M886,14 L886,24" stroke="#D4AF37" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M14,96 L24,96 M14,96 L14,86" stroke="#D4AF37" stroke-width="1.2" fill="none" opacity="0.6"/>
  <path d="M886,96 L876,96 M886,96 L886,86" stroke="#D4AF37" stroke-width="1.2" fill="none" opacity="0.6"/>

  <!-- 4 Telemetry Architecture Columns (Quiet Luxury) -->
  <!-- Column 1: Methodology -->
  <g transform="translate(42, 28)">
    <circle cx="8" cy="8" r="3.5" fill="#10B981" class="beacon"/>
    <text x="22" y="11" fill="#ffffff" fill-opacity="0.45" font-family="'Space Mono', monospace" font-size="9" font-weight="600" letter-spacing="1.5">TELEMETRY // PROTOCOL</text>
    <text x="0" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">5-Step Architecture</text>
    <text x="0" y="58" fill="#10B981" font-family="'Space Mono', monospace" font-size="10" font-weight="600">STATUS: NOMINAL 100%</text>
  </g>

  <line x1="245" y1="24" x2="245" y2="86" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Column 2: Mutex / Concurrency -->
  <g transform="translate(268, 28)">
    <text x="0" y="11" fill="#ffffff" fill-opacity="0.45" font-family="'Space Mono', monospace" font-size="9" font-weight="600" letter-spacing="1.5">RACE DEFENSE</text>
    <text x="0" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Atomic Mutex Locks</text>
    <text x="0" y="58" fill="#D4AF37" font-family="'Space Mono', monospace" font-size="10" font-weight="600">ZERO-REGRESSION GUARD</text>
  </g>

  <line x1="465" y1="24" x2="465" y2="86" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Column 3: Multi-Tenant -->
  <g transform="translate(488, 28)">
    <text x="0" y="11" fill="#ffffff" fill-opacity="0.45" font-family="'Space Mono', monospace" font-size="9" font-weight="600" letter-spacing="1.5">DATA PARTITIONING</text>
    <text x="0" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Multi-Tenant Isolation</text>
    <text x="0" y="58" fill="#00F0FF" font-family="'Space Mono', monospace" font-size="10" font-weight="600">ZERO CROSS-LEAKAGE</text>
  </g>

  <line x1="685" y1="24" x2="685" y2="86" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <!-- Column 4: Primary Node -->
  <g transform="translate(708, 28)">
    <text x="0" y="11" fill="#ffffff" fill-opacity="0.45" font-family="'Space Mono', monospace" font-size="9" font-weight="600" letter-spacing="1.5">PRIMARY TIME-NODE</text>
    <text x="0" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="14" font-weight="700">Tashkent <tspan fill="#D4AF37">UTC+5</tspan></text>
    <text x="0" y="58" fill="#ffffff" fill-opacity="0.6" font-family="'Space Mono', monospace" font-size="10" font-weight="600">LATENCY: &lt;15ms // TLS 1.3</text>
  </g>
</svg>
