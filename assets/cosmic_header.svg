<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Deep Obsidian Matte Background -->
    <radialGradient id="obsidianSpace" cx="30%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="45%" stop-color="#07080b"/>
      <stop offset="85%" stop-color="#040507"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>

    <!-- Champagne Gold Shimmer Gradient -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>

    <!-- Subtle Amber/Gold Atmospheric Glow -->
    <radialGradient id="ambientGold" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Planet Spherical 3D Shading (Cosmic Obsidian Sphere) -->
    <radialGradient id="luxurySphere" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#2a3042"/>
      <stop offset="25%" stop-color="#181d29"/>
      <stop offset="55%" stop-color="#0e111a"/>
      <stop offset="80%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <!-- Planet Atmosphere Corona Glow -->
    <radialGradient id="planetCorona" cx="35%" cy="32%" r="75%">
      <stop offset="65%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="88%" stop-color="#D4AF37" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Secondary Moon Spherical Gradient -->
    <radialGradient id="moonGrad" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Planet Clip Path (Sphere Mask) -->
    <clipPath id="planetClip">
      <circle cx="730" cy="130" r="75"/>
    </clipPath>

    <!-- Ring Back/Front Clip -->
    <clipPath id="ringFrontClip">
      <rect x="610" y="125" width="240" height="120"/>
    </clipPath>

    <!-- Luxury Drop Shadow -->
    <filter id="luxuryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <style>
    @keyframes luxuryOrbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseAura {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.6; }
    }
    @keyframes rotateTerrain {
      0% { transform: translateX(0); }
      100% { transform: translateX(-300px); }
    }
    .orbit-ring {
      transform-origin: 730px 130px;
      animation: luxuryOrbit 32s linear infinite;
    }
    .pulse-glow {
      animation: pulseAura 4s ease-in-out infinite;
    }
  </style>

  <!-- Deep Obsidian Container Card -->
  <rect width="900" height="260" rx="20" fill="url(#obsidianSpace)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" filter="url(#luxuryShadow)"/>
  <rect width="900" height="260" rx="20" fill="url(#ambientGold)"/>

  <!-- Subtle Minimal Stardust -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="120" cy="45" r="1"/>
    <circle cx="280" cy="30" r="0.8"/>
    <circle cx="450" cy="65" r="1.2"/>
    <circle cx="340" cy="220" r="0.9"/>
    <circle cx="180" cy="235" r="1.1"/>
    <circle cx="620" cy="40" r="1.3"/>
    <circle cx="860" cy="220" r="1"/>
  </g>

  <!-- ================= 3D ROTATING PLANET SYSTEM (QUIET LUXURY) ================= -->
  <g id="planet-system" transform="translate(10, 0)">
    <!-- Corona Glow -->
    <circle cx="730" cy="130" r="82" fill="none" stroke="#D4AF37" stroke-width="4" opacity="0.25" class="pulse-glow"/>
    <circle cx="730" cy="130" r="78" fill="none" stroke="#00F0FF" stroke-width="2" opacity="0.2"/>

    <!-- Planetary Rings: Back Half -->
    <g transform="rotate(-20 730 130)">
      <ellipse cx="730" cy="130" rx="142" ry="34" fill="none" stroke="url(#goldLuxury)" stroke-width="2.5" stroke-opacity="0.45" stroke-dasharray="6 3"/>
      <ellipse cx="730" cy="130" rx="128" ry="26" fill="none" stroke="#00F0FF" stroke-width="1.2" stroke-opacity="0.35"/>
    </g>

    <!-- Planet Body (Obsidian Sphere Base) -->
    <circle cx="730" cy="130" r="75" fill="url(#luxurySphere)"/>

    <!-- Surface Terrain / Contour Bands -->
    <g clip-path="url(#planetClip)">
      <g style="animation: rotateTerrain 20s linear infinite;">
        <g id="terrain-pattern">
          <path d="M640,80 Q670,60 700,85 T760,80 T820,95 T880,75 T940,90" fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
          <path d="M620,110 Q660,130 710,105 T790,125 T860,100 T920,120 T980,105" fill="none" stroke="#F5D77F" stroke-width="10" stroke-linecap="round" opacity="0.22"/>
          <path d="M630,145 Q680,120 730,150 T810,135 T890,160 T960,140" fill="none" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" opacity="0.18"/>
          <circle cx="680" cy="130" r="1.5" fill="#FFEBB0" opacity="0.7"/>
          <circle cx="740" cy="115" r="1.8" fill="#FFEBB0" opacity="0.8"/>
          <circle cx="790" cy="140" r="2.0" fill="#00F0FF" opacity="0.7"/>
        </g>
        <g transform="translate(300, 0)">
          <path d="M640,80 Q670,60 700,85 T760,80 T820,95 T880,75 T940,90" fill="none" stroke="#D4AF37" stroke-width="8" stroke-linecap="round" opacity="0.2"/>
          <path d="M620,110 Q660,130 710,105 T790,125 T860,100 T920,120 T980,105" fill="none" stroke="#F5D77F" stroke-width="10" stroke-linecap="round" opacity="0.22"/>
          <path d="M630,145 Q680,120 730,150 T810,135 T890,160 T960,140" fill="none" stroke="#00F0FF" stroke-width="8" stroke-linecap="round" opacity="0.18"/>
          <circle cx="680" cy="130" r="1.5" fill="#FFEBB0" opacity="0.7"/>
          <circle cx="740" cy="115" r="1.8" fill="#FFEBB0" opacity="0.8"/>
          <circle cx="790" cy="140" r="2.0" fill="#00F0FF" opacity="0.7"/>
        </g>
      </g>
      <!-- Shadow Terminator -->
      <circle cx="730" cy="130" r="75" fill="url(#planetCorona)"/>
      <radialGradient id="sphereShadow" cx="28%" cy="28%" r="75%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
        <stop offset="50%" stop-color="#000000" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#020305" stop-opacity="0.96"/>
      </radialGradient>
      <circle cx="730" cy="130" r="75" fill="url(#sphereShadow)"/>
    </g>

    <!-- Planetary Rings: Front Half -->
    <g transform="rotate(-20 730 130)" clip-path="url(#ringFrontClip)">
      <ellipse cx="730" cy="130" rx="142" ry="34" fill="none" stroke="url(#goldLuxury)" stroke-width="3" stroke-opacity="0.85"/>
      <ellipse cx="730" cy="130" rx="128" ry="26" fill="none" stroke="#00F0FF" stroke-width="1.6" stroke-opacity="0.6"/>
    </g>

    <!-- Orbiting Platinum Satellite -->
    <g class="orbit-ring">
      <circle cx="848" cy="130" r="5" fill="#FFEBB0"/>
      <circle cx="848" cy="130" r="8" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.5"/>
    </g>
  </g>

  <!-- ================= FOREGROUND HERO BRANDING & IDENTITY ================= -->
  <!-- Glass Backdrop for Crisp Readability -->
  <rect x="36" y="32" width="540" height="196" rx="16" fill="#080a10" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Live Status Monolith Capsule -->
  <g transform="translate(56, 54)">
    <circle cx="6" cy="6" r="3.5" fill="#10B981" class="pulse-glow"/>
    <text x="18" y="9.5" fill="#ffffff" fill-opacity="0.65" font-family="'Space Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="1.5">TASHKENT (UTC+5) · ARCHITECTING ENTERPRISE AI</text>
  </g>

  <!-- Main Name Title -->
  <text x="56" y="108" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="800" letter-spacing="-0.03em">
    JAVOHIRBEK <tspan fill="url(#goldLuxury)">ASQAROV</tspan>
  </text>
  <text x="56" y="132" fill="#D4AF37" font-family="'Space Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">
    (JASPER) · FULL-CYCLE PRODUCT ARCHITECT &amp; AI SYSTEMS FOUNDER
  </text>

  <!-- Luxury Feature Pills -->
  <g transform="translate(56, 162)">
    <!-- Pill 1: FastAPI & Next -->
    <g transform="translate(0, 0)">
      <rect width="118" height="28" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1"/>
      <text x="59" y="18" fill="#FFEBB0" font-family="'Space Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">FASTAPI &amp; NEXT.JS</text>
    </g>

    <!-- Pill 2: AI Swarms -->
    <g transform="translate(126, 0)">
      <rect width="120" height="28" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="60" y="18" fill="#ffffff" fill-opacity="0.85" font-family="'Space Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">GEMINI AI AGENTS</text>
    </g>

    <!-- Pill 3: Voice Copilot -->
    <g transform="translate(254, 0)">
      <rect width="116" height="28" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1"/>
      <text x="58" y="18" fill="#E0F7FA" font-family="'Space Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">VOICE COPILOT</text>
    </g>

    <!-- Pill 4: FinTech SDKs -->
    <g transform="translate(378, 0)">
      <rect width="112" height="28" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1"/>
      <text x="56" y="18" fill="#FFEBB0" font-family="'Space Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">FINTECH SDKs</text>
    </g>
  </g>
</svg>