<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Deep Space Obsidian Gradient -->
    <radialGradient id="obsidianSpace" cx="30%" cy="40%" r="90%">
      <stop offset="0%" stop-color="#0c0e14"/>
      <stop offset="45%" stop-color="#07080b"/>
      <stop offset="85%" stop-color="#040507"/>
      <stop offset="100%" stop-color="#020304"/>
    </radialGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA7"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>

    <!-- Ambient Gold Glow -->
    <radialGradient id="ambientGold" cx="25%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.01"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- ==================== REALISTIC PLANET EARTH SHADING ==================== -->
    <!-- Earth Deep Ocean Base -->
    <radialGradient id="earthOcean" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1e6091"/>
      <stop offset="35%" stop-color="#154a75"/>
      <stop offset="70%" stop-color="#0d2b45"/>
      <stop offset="100%" stop-color="#05131f"/>
    </radialGradient>

    <!-- Atmospheric Corona (Outer Blue Glow) -->
    <radialGradient id="atmosphereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="93%" stop-color="#00d2ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.85"/>
    </radialGradient>

    <!-- Earth Day/Night Terminator (Sunlight from top-left) -->
    <radialGradient id="earthTerminator" cx="32%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="42%" stop-color="#000000" stop-opacity="0.05"/>
      <stop offset="65%" stop-color="#020712" stop-opacity="0.65"/>
      <stop offset="90%" stop-color="#010307" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.99"/>
    </radialGradient>

    <!-- Thin Atmospheric Rim Scattering -->
    <radialGradient id="atmosphericRim" cx="34%" cy="30%" r="68%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="85%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="96%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Moon Shading -->
    <radialGradient id="moonSphere" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="80%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Planet Mask (Clip to Sphere) -->
    <clipPath id="earthClip">
      <circle cx="740" cy="130" r="76"/>
    </clipPath>

    <!-- Card Shadow -->
    <filter id="luxuryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.9"/>
    </filter>

    <filter id="earthBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes earthSpin {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }
    @keyframes cloudsSpin {
      0% { transform: translateX(0); }
      100% { transform: translateX(-400px); }
    }
    @keyframes orbitMoon {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulseAurora {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 0.75; }
    }
    .earth-continents {
      animation: earthSpin 32s linear infinite;
    }
    .earth-clouds {
      animation: cloudsSpin 24s linear infinite;
    }
    .moon-orbit {
      transform-origin: 740px 130px;
      animation: orbitMoon 28s linear infinite;
    }
    .aurora-pulse {
      animation: pulseAurora 5s ease-in-out infinite;
    }
  </style>

  <!-- Deep Obsidian Container Card -->
  <rect width="900" height="260" rx="20" fill="url(#obsidianSpace)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" filter="url(#luxuryShadow)"/>
  <rect width="900" height="260" rx="20" fill="url(#ambientGold)"/>

  <!-- Subtle Stardust -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="120" cy="45" r="1"/>
    <circle cx="280" cy="30" r="0.8"/>
    <circle cx="450" cy="65" r="1.2"/>
    <circle cx="340" cy="220" r="0.9"/>
    <circle cx="180" cy="235" r="1.1"/>
    <circle cx="620" cy="40" r="1.3"/>
    <circle cx="680" cy="230" r="0.9"/>
    <circle cx="860" cy="235" r="1.1"/>
    <circle cx="875" cy="45" r="1.3"/>
  </g>

  <!-- ================= HAQIQIY YER SAYYORASI (PLANET EARTH) ================= -->
  <g id="real-earth-system">
    
    <!-- Outer Atmospheric Halo (Glow in the dark space) -->
    <circle cx="740" cy="130" r="82" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.45" filter="url(#earthBloom)" class="aurora-pulse"/>
    <circle cx="740" cy="130" r="77" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.3"/>

    <!-- Orbital Line for ISS / Satellite (Sleek Golden Orbital Flight Path) -->
    <g transform="rotate(-18 740 130)">
      <ellipse cx="740" cy="130" rx="130" ry="34" fill="none" stroke="url(#goldLuxury)" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="4 6"/>
      <ellipse cx="740" cy="130" rx="122" ry="30" fill="none" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.25"/>
    </g>

    <!-- EARTH SPHERE BASE (Deep Oceans) -->
    <circle cx="740" cy="130" r="76" fill="url(#earthOcean)"/>

    <!-- EARTH CLIP ZONE (Rotating Continents, City Lights & Clouds) -->
    <g clip-path="url(#earthClip)">
      
      <!-- CONTINENTS LAYER (Seamless Dual Repeating Pattern for 360° Loop) -->
      <g class="earth-continents">
        <!-- CONTINENT BLOCK 1 (400px width) -->
        <g id="continents-pattern" transform="translate(540, 54)">
          <!-- Eurasia & Africa -->
          <!-- Europe / Mediterranean -->
          <path d="M160,28 Q175,20 195,24 T225,30 T240,42 T215,55 T180,48 Z" fill="#2d6a4f" opacity="0.92"/>
          <path d="M190,32 Q205,25 218,34 T200,45 Z" fill="#40916c"/>
          <!-- Great Steppe / Central Asia & Uzbekistan -->
          <path d="M220,32 Q245,26 270,35 T300,42 T285,60 T240,54 T225,40 Z" fill="#52796f" opacity="0.95"/>
          <circle cx="255" cy="42" r="3" fill="#606c38" title="Central Asia / Tashkent"/>
          <!-- East Asia / China / India -->
          <path d="M255,48 Q280,45 305,58 T320,80 T290,95 T265,85 T250,65 Z" fill="#2d6a4f" opacity="0.9"/>
          <path d="M260,65 Q275,70 270,88 T255,80 Z" fill="#40916c"/> <!-- Indian Subcontinent -->
          <!-- Africa -->
          <path d="M165,58 Q195,54 210,65 T218,95 T195,130 T170,110 T150,75 Z" fill="#588157" opacity="0.92"/>
          <path d="M170,62 Q195,60 205,75 T190,88 T165,72 Z" fill="#a3b18a" opacity="0.75"/> <!-- Sahara Desert -->
          
          <!-- Americas -->
          <!-- North America -->
          <path d="M25,18 Q55,10 75,25 T95,45 T70,70 T45,60 T15,35 Z" fill="#2d6a4f" opacity="0.92"/>
          <path d="M35,28 Q60,22 80,35 T65,55 T30,45 Z" fill="#3a5a40"/>
          <!-- Central America Isthmus -->
          <path d="M68,68 Q75,75 78,85 T72,92 Z" fill="#2d6a4f"/>
          <!-- South America -->
          <path d="M72,90 Q95,92 110,105 T100,135 T78,148 T65,120 Z" fill="#1b4332" opacity="0.95"/>
          <path d="M78,98 Q95,100 102,115 T88,135 T72,110 Z" fill="#40916c"/> <!-- Amazon Basin -->

          <!-- Australia & Oceania -->
          <path d="M320,105 Q345,100 355,115 T340,135 T315,125 Z" fill="#a3b18a" opacity="0.9"/>
          <!-- Greenland / Arctic Ice -->
          <path d="M105,10 Q125,5 135,16 T115,24 Z" fill="#e2e8f0" opacity="0.95"/>
          <!-- Antarctica Ice Coast -->
          <path d="M0,145 Q80,140 160,146 T280,142 T400,145 L400,160 L0,160 Z" fill="#f1f5f9" opacity="0.92"/>

          <!-- NIGHT CITY LIGHTS (Gleaming Golden Metropolis Points on Dark Hemisphere) -->
          <g fill="#fbbf24" opacity="0.85">
            <circle cx="185" cy="38" r="1.2"/> <!-- London/Paris -->
            <circle cx="254" cy="42" r="1.5"/> <!-- Tashkent Gold Light -->
            <circle cx="270" cy="74" r="1.2"/> <!-- Mumbai/Delhi -->
            <circle cx="310" cy="62" r="1.4"/> <!-- Shanghai/Tokyo -->
            <circle cx="75" cy="38" r="1.5"/>  <!-- New York/East Coast -->
            <circle cx="45" cy="42" r="1.2"/>  <!-- Chicago -->
            <circle cx="28" cy="48" r="1.2"/>  <!-- West Coast -->
            <circle cx="85" cy="115" r="1.2"/> <!-- Sao Paulo -->
          </g>
        </g>

        <!-- CONTINENT BLOCK 2 (Clone shifted by 400px for seamless loop) -->
        <g transform="translate(940, 54)">
          <!-- Europe / Mediterranean -->
          <path d="M160,28 Q175,20 195,24 T225,30 T240,42 T215,55 T180,48 Z" fill="#2d6a4f" opacity="0.92"/>
          <path d="M190,32 Q205,25 218,34 T200,45 Z" fill="#40916c"/>
          <!-- Central Asia & Uzbekistan -->
          <path d="M220,32 Q245,26 270,35 T300,42 T285,60 T240,54 T225,40 Z" fill="#52796f" opacity="0.95"/>
          <circle cx="255" cy="42" r="3" fill="#606c38"/>
          <!-- East Asia / India -->
          <path d="M255,48 Q280,45 305,58 T320,80 T290,95 T265,85 T250,65 Z" fill="#2d6a4f" opacity="0.9"/>
          <path d="M260,65 Q275,70 270,88 T255,80 Z" fill="#40916c"/>
          <!-- Africa -->
          <path d="M165,58 Q195,54 210,65 T218,95 T195,130 T170,110 T150,75 Z" fill="#588157" opacity="0.92"/>
          <path d="M170,62 Q195,60 205,75 T190,88 T165,72 Z" fill="#a3b18a" opacity="0.75"/>
          <!-- Americas -->
          <path d="M25,18 Q55,10 75,25 T95,45 T70,70 T45,60 T15,35 Z" fill="#2d6a4f" opacity="0.92"/>
          <path d="M35,28 Q60,22 80,35 T65,55 T30,45 Z" fill="#3a5a40"/>
          <path d="M68,68 Q75,75 78,85 T72,92 Z" fill="#2d6a4f"/>
          <path d="M72,90 Q95,92 110,105 T100,135 T78,148 T65,120 Z" fill="#1b4332" opacity="0.95"/>
          <path d="M78,98 Q95,100 102,115 T88,135 T72,110 Z" fill="#40916c"/>
          <!-- Australia -->
          <path d="M320,105 Q345,100 355,115 T340,135 T315,125 Z" fill="#a3b18a" opacity="0.9"/>
          <!-- Greenland / Arctic -->
          <path d="M105,10 Q125,5 135,16 T115,24 Z" fill="#e2e8f0" opacity="0.95"/>
          <path d="M0,145 Q80,140 160,146 T280,142 T400,145 L400,160 L0,160 Z" fill="#f1f5f9" opacity="0.92"/>

          <!-- NIGHT CITY LIGHTS -->
          <g fill="#fbbf24" opacity="0.85">
            <circle cx="185" cy="38" r="1.2"/>
            <circle cx="254" cy="42" r="1.5"/>
            <circle cx="270" cy="74" r="1.2"/>
            <circle cx="310" cy="62" r="1.4"/>
            <circle cx="75" cy="38" r="1.5"/>
            <circle cx="45" cy="42" r="1.2"/>
            <circle cx="28" cy="48" r="1.2"/>
            <circle cx="85" cy="115" r="1.2"/>
          </g>
        </g>
      </g>

      <!-- DYNAMIC CLOUDS LAYER (Photorealistic Swirling Atmospheric White Clouds) -->
      <g class="earth-clouds">
        <!-- Clouds Set 1 -->
        <g transform="translate(540, 54)">
          <!-- Swirl 1 -->
          <path d="M30,35 Q60,20 100,32 T170,25 T240,38 T310,28 T370,40" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
          <path d="M45,38 Q85,25 125,36 T195,30 T260,42" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
          <!-- Cyclone Vortex over Ocean -->
          <path d="M130,70 Q145,55 165,65 T175,85 T155,95 T135,80 Z" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.75"/>
          <!-- Equatorial Cloud Band -->
          <path d="M10,85 Q70,95 130,82 T210,90 T290,80 T380,92" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
          <path d="M20,86 Q80,94 140,84 T230,88 T310,82" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
          <!-- Southern Vortex -->
          <path d="M50,120 Q110,135 180,118 T260,130 T340,115 T390,128" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.6"/>
          <path d="M70,122 Q130,132 195,120 T280,128" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
        </g>
        <!-- Clouds Set 2 (Shifted by 400px) -->
        <g transform="translate(940, 54)">
          <path d="M30,35 Q60,20 100,32 T170,25 T240,38 T310,28 T370,40" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
          <path d="M45,38 Q85,25 125,36 T195,30 T260,42" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
          <path d="M130,70 Q145,55 165,65 T175,85 T155,95 T135,80 Z" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.75"/>
          <path d="M10,85 Q70,95 130,82 T210,90 T290,80 T380,92" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.55"/>
          <path d="M20,86 Q80,94 140,84 T230,88 T310,82" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
          <path d="M50,120 Q110,135 180,118 T260,130 T340,115 T390,128" fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.6"/>
          <path d="M70,122 Q130,132 195,120 T280,128" fill="none" stroke="#f8fafc" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
        </g>
      </g>

      <!-- 3D SPHERICAL SHADOW TERMINATOR (Day vs Night Curve) -->
      <circle cx="740" cy="130" r="76" fill="url(#earthTerminator)"/>
      
      <!-- ATMOSPHERIC RIM SCATTERING (The famous thin blue limb of Earth) -->
      <circle cx="740" cy="130" r="76" fill="url(#atmosphericRim)"/>
    </g>

    <!-- FRONT HALF OF ORBITAL SATELLITE / ISS PATH -->
    <g transform="rotate(-18 740 130)">
      <!-- The front arc of orbital path -->
      <path d="M 610 130 A 130 34 0 0 0 870 130" fill="none" stroke="url(#goldLuxury)" stroke-width="1.8" stroke-opacity="0.85"/>
      <path d="M 618 130 A 122 30 0 0 0 862 130" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-opacity="0.6"/>
    </g>

    <!-- NATURAL SATELLITE: ORBITING MOON (LUNA) -->
    <g class="moon-orbit">
      <!-- Moon body -->
      <circle cx="862" cy="130" r="6" fill="url(#moonSphere)"/>
      <!-- Moon crater detail -->
      <circle cx="861" cy="129" r="1" fill="#334155" opacity="0.4"/>
      <circle cx="863" cy="132" r="1.4" fill="#334155" opacity="0.3"/>
      <!-- Moon soft halo -->
      <circle cx="862" cy="130" r="8" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.3"/>
    </g>
  </g>

  <!-- ================= FOREGROUND HERO BRANDING & IDENTITY ================= -->
  <!-- Glass Backdrop for Crisp Readability -->
  <rect x="36" y="32" width="540" height="196" rx="16" fill="#080a10" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Live Status Monolith Capsule -->
  <g transform="translate(56, 54)">
    <circle cx="6" cy="6" r="3.5" fill="#10B981" class="aurora-pulse"/>
    <text x="18" y="9.5" fill="#ffffff" fill-opacity="0.65" font-family="'Space Mono', monospace" font-size="9.5" font-weight="600" letter-spacing="1.5">TASHKENT (UTC+5) · ARCHITECTING ENTERPRISE AI</text>
  </g>

  <!-- Main Name Title -->
  <text x="56" y="108" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="800" letter-spacing="-0.03em">
    JAVOHIRBEK <tspan fill="url(#goldLuxury)">ASQAROV</tspan>
  </text>
  <text x="56" y="132" fill="#D4AF37" font-family="'Space Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.5">
    (JASPER) · FULL-CYCLE PRODUCT ARCHITECT &amp; AI SYSTEMS FOUNDER
  </text>

  <!-- Luxury Feature Pills -->
  <g transform="translate(56, 162)">
    <!-- Pill 1: FastAPI & Next -->
    <g transform="translate(0, 0)">
      <rect width="118" height="28" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1"/>
      <text x="59" y="18" fill="#FFEBB0" font-family="'Space Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">FASTAPI &amp; NEXT.JS</text>
    </g>

    <!-- Pill 2: AI Swarms -->
    <g transform="translate(126, 0)">
      <rect width="120" height="28" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="60" y="18" fill="#ffffff" fill-opacity="0.85" font-family="'Space Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">GEMINI AI AGENTS</text>
    </g>

    <!-- Pill 3: Voice Copilot -->
    <g transform="translate(254, 0)">
      <rect width="116" height="28" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#00F0FF" stroke-opacity="0.3" stroke-width="1"/>
      <text x="58" y="18" fill="#E0F7FA" font-family="'Space Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">VOICE COPILOT</text>
    </g>

    <!-- Pill 4: FinTech SDKs -->
    <g transform="translate(378, 0)">
      <rect width="112" height="28" rx="8" fill="#ffffff" fill-opacity="0.03" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1"/>
      <text x="56" y="18" fill="#FFEBB0" font-family="'Space Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">FINTECH SDKs</text>
    </g>
  </g>
</svg>
