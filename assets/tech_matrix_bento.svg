      <text x="132" y="14" fill="#ffffff" fill-opacity="0.6" font-family="'Space Mono', monospace" font-size="8.5" text-anchor="middle">Originkit 3D</text>

      <rect x="180" width="80" height="20" rx="5" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="220" y="14" fill="#ffffff" fill-opacity="0.6" font-family="'Space Mono', monospace" font-size="8.5" text-anchor="middle">Glassmorphism</text>
    </g>
  </g>

