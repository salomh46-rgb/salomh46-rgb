  <g transform="translate(458, 148)" filter="url(#bentoShadow)">
    <rect width="424" height="96" rx="14" fill="url(#cardGlass)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="18" y="24" fill="#D4AF37" font-family="'Space Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="1">
      💳 FINTECH, PROTOCOLS &amp; DEFENSE
    </text>
    <g transform="translate(18, 38)">
      <rect width="92" height="22" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#D4AF37" stroke-opacity="0.35"/>
      <text x="46" y="15" fill="#FFEBB0" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">Payme / Click / Uzum</text>

