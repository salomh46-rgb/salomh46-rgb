<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Deep Obsidian Matte Background -->
    <radialGradient id="matrixBg" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0c0e15"/>
      <stop offset="60%" stop-color="#06070a"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <!-- Luxury Card Glass Fill -->
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="bentoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="900" height="260" rx="18" fill="url(#matrixBg)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.2" filter="url(#bentoShadow)"/>

  <!-- Top Title Monolith Pill -->
  <g transform="translate(450, 24)">
    <text x="0" y="0" fill="#FFEBB0" font-family="'Space Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="2" text-anchor="middle">
      QUANTUM TECH MATRIX // FULL-CYCLE ARCHITECT STACK
    </text>
  </g>

  <!-- ================= CARD 1: CORE SYSTEMS & BACKEND (TOP-LEFT) ================= -->
  <g transform="translate(18, 42)" filter="url(#bentoShadow)">
    <rect width="424" height="96" rx="14" fill="url(#cardGlass)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <text x="18" y="24" fill="#FFEBB0" font-family="'Space Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="1">
      ⚙️ CORE SYSTEMS &amp; BACKEND
    </text>
    <g transform="translate(18, 38)">
      <rect width="112" height="22" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#D4AF37" stroke-opacity="0.35"/>
      <text x="56" y="15" fill="#FFEBB0" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">Python 3.12 / FastAPI</text>
      
      <rect x="118" width="92" height="22" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="164" y="15" fill="#ffffff" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">PostgreSQL / RLS</text>

      <rect x="216" width="76" height="22" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="254" y="15" fill="#ffffff" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">Redis 7 WAL</text>

      <rect x="298" width="88" height="22" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#00F0FF" stroke-opacity="0.3"/>
      <text x="342" y="15" fill="#00F0FF" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">Temporal.io</text>
    </g>
    <g transform="translate(18, 66)">
