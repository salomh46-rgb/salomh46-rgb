      <text x="145" y="15" fill="#ffffff" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">PCI-DSS Security</text>

      <rect x="198" width="98" height="22" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="247" y="15" fill="#ffffff" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">Zero-Leak Guard</text>

      <rect x="302" width="86" height="22" rx="6" fill="#ffffff" fill-opacity="0.03" stroke="#00F0FF" stroke-opacity="0.3"/>
      <text x="345" y="15" fill="#00F0FF" font-family="'Space Mono', monospace" font-size="9" text-anchor="middle">Idempotency</text>
    </g>
    <g transform="translate(18, 66)">
      <rect width="84" height="20" rx="5" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="42" y="14" fill="#ffffff" fill-opacity="0.6" font-family="'Space Mono', monospace" font-size="8.5" text-anchor="middle">k6 Stress Test</text>

      <rect x="90" width="84" height="20" rx="5" fill="#ffffff" fill-opacity="0.02" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="132" y="14" fill="#ffffff" fill-opacity="0.6" font-family="'Space Mono', monospace" font-size="8.5" text-anchor="middle">UFW / Hardening</text>

