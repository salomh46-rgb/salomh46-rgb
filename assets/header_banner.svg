<svg fill="none" viewBox="0 0 850 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .banner-box {
          background: radial-gradient(circle at 50% 30%, #0e1c3e 0%, #050811 80%);
          border: 1px solid rgba(0, 240, 255, 0.45);
          border-radius: 18px;
          height: 220px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          position: relative;
          overflow: hidden;
          box-shadow: 0 10px 40px rgba(0, 240, 255, 0.15);
        }
        .glow {
          position: absolute;
          width: 450px;
          height: 120px;
          background: linear-gradient(90deg, #00f0ff, #bd00ff);
          filter: blur(60px);
          opacity: 0.35;
          border-radius: 50%;
        }
        .title {
          font-size: 32px;
          font-weight: 900;
          color: #ffffff;
          letter-spacing: 3px;
          text-transform: uppercase;
          margin: 0;
          text-shadow: 0 0 20px rgba(0, 240, 255, 0.8), 0 0 40px rgba(189, 0, 255, 0.5);
          z-index: 2;
        }
        .subtitle {
          font-size: 13px;
          font-weight: 700;
          color: #00f0ff;
          letter-spacing: 4px;
          text-transform: uppercase;
          margin-top: 8px;
          z-index: 2;
          text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }
        .badges {
          display: flex;
          gap: 10px;
          margin-top: 14px;
          z-index: 2;
        }
        .pill {
          background: rgba(255, 255, 255, 0.08);
          border: 1px solid rgba(0, 240, 255, 0.4);
          padding: 5px 12px;
          border-radius: 9999px;
          font-size: 11px;
          font-weight: 700;
          color: #f1f5f9;
          letter-spacing: 1px;
        }
      </style>
      <div class="banner-box">
        <div class="glow"></div>
        <h1 class="title">JAVOHIRBEK ASQAROV (JASPER)</h1>
        <div class="subtitle">FULL-STACK ARCHITECT &amp; AI SYSTEMS ENGINEER</div>
        <div class="badges">
          <span class="pill">⚡ FASTAPI &amp; NEXT.JS 14</span>
          <span class="pill">🤖 GEMINI AI AGENTS</span>
          <span class="pill">🎙️ NEURAL LIVE COPILOT</span>
          <span class="pill">💳 FINTECH SDKs</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>