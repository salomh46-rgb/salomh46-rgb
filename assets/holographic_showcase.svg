<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 640" width="100%" height="640">
  <defs>
    <!-- Deep Space Radial Matrix -->
    <radialGradient id="showcaseBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#0b1638"/>
      <stop offset="60%" stop-color="#040818"/>
      <stop offset="100%" stop-color="#02040b"/>
    </radialGradient>

    <!-- Card 1 Glass Gradient (Cyan / Blue) -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2348" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#051026" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Card 2 Glass Gradient (Violet / Purple) -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261044" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0e051e" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Card 3 Glass Gradient (Emerald / Teal) -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2c30" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#031317" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Card 4 Glass Gradient (Amber / Rose) -->
    <linearGradient id="card4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30132a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#140514" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Card Drop Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <style>
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.35; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.25); }
    }
    @keyframes holoPulse {
      0%, 100% { stroke-opacity: 0.45; }
      50% { stroke-opacity: 0.95; }
    }
    .beacon {
      animation: beaconBlink 1.8s ease-in-out infinite;
      transform-origin: 0px 0px;
    }
    .holo-border {
      animation: holoPulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Canvas Outer Container -->
  <rect width="920" height="640" rx="20" fill="url(#showcaseBg)" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.6"/>

  <!-- Top Showcase Header Badge -->
  <g transform="translate(460, 36)">
    <rect x="-260" y="-16" width="520" height="32" rx="16" fill="rgba(0, 240, 255, 0.08)" stroke="#00f0ff" stroke-opacity="0.5" stroke-width="1.2"/>
