<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 920 620" width="100%" height="620">
  <defs>
    <!-- Background Space Matrix -->
    <radialGradient id="showcaseBg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0b1638"/>
      <stop offset="60%" stop-color="#040818"/>
      <stop offset="100%" stop-color="#02040b"/>
    </radialGradient>

    <!-- Card 1 Glass Gradient (Cyan / Blue) -->
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2246" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#061024" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Card 2 Glass Gradient (Violet / Purple) -->
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24103f" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0e061c" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Card 3 Glass Gradient (Emerald / Teal) -->
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a2e" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#041216" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Card 4 Glass Gradient (Amber / Rose) -->
    <linearGradient id="card4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1428" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#120612" stop-opacity="0.96"/>
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes beaconBlink {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    @keyframes holoPulse {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }
    .beacon {
      animation: beaconBlink 1.8s ease-in-out infinite;
    }
    .holo-border {
      animation: holoPulse 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Base Container -->
  <rect width="920" height="620" rx="22" fill="url(#showcaseBg)" stroke="#00f0ff" stroke-opacity="0.35" stroke-width="1.6"/>

  <!-- Top Showcase Header -->
  <g transform="translate(460, 36)">
