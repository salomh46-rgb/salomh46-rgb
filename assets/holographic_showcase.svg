    <text x="42" y="31" fill="#c084fc" font-family="'Space Mono', monospace" font-size="9.5" font-weight="700" letter-spacing="1">WORLD-1ST SEMANTIC ARCHIVER</text>
    <text x="384" y="31" fill="#FFEBB0" font-family="'Space Mono', monospace" font-size="9" font-weight="600" text-anchor="end">★ BREAKTHROUGH</text>

    <!-- Icon & Title -->
    <text x="24" y="68" font-size="20">🗜️</text>
    <text x="54" y="66" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700">CognitiveZip (.czip) — AI Codebase</text>
    
    <!-- Desc -->
    <text x="24" y="94" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5">
