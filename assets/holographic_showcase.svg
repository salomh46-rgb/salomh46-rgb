<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="620">
  <defs>
    <!-- Deep Obsidian Matte Background -->
    <radialGradient id="showcaseBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#0e121a"/>
      <stop offset="50%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#020305"/>
    </radialGradient>

    <!-- Champagne Gold Gradient -->
    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA7"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#99700C"/>
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Royal Violet / Magenta Gradient -->
    <linearGradient id="violetGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <!-- Emerald Defense Gradient -->
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glass Card Gradient Fill -->
    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.045"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="luxuryShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseDot {
      0%, 100% { opacity: 0.35; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes beamFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .beacon {
      animation: pulseDot 2.8s ease-in-out infinite;
      transform-origin: center;
    }
    .beam-line {
      stroke-dasharray: 40 120;
      animation: beamFlow 6s linear infinite;
    }
  </style>

  <!-- Container Box -->
  <rect width="920" height="620" rx="20" fill="url(#showcaseBg)" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.2" filter="url(#luxuryShadow)"/>

  <!-- Top Title Monolith Pill -->
  <g transform="translate(260, 24)">
    <rect width="400" height="34" rx="17" fill="#ffffff" fill-opacity="0.03" stroke="url(#goldLuxury)" stroke-opacity="0.5" stroke-width="1"/>
    <text x="200" y="21.5" fill="#FFEBB0" font-family="'Space Mono', monospace" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">
      2026 FLAGSHIP SYSTEMS // CORE ARCHITECTURES
    </text>
  </g>

