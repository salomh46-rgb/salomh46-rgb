name: Daily Autonomous AI Lab 🚀

on:
  schedule:
    - cron: '0 0 * * *' # Executes daily at 00:00 UTC
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install AI & Testing Dependencies
        run: |
          pip install --upgrade pip
          pip install google-genai pytest

      - name: Execute Daily Autonomous AI Builder
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python .github/scripts/daily_builder.py

      - name: Commit and Push Autonomous Daily Software
        run: |
          git config --global user.name "Jasper AI Autopilot"
          git config --global user.email "salomh46@gmail.com"
          git add .
          BUILD_MSG=$(cat .github/scripts/latest_commit_msg.txt 2>/dev/null || echo "feat(ai-lab): autonomous daily open-source tool build & verified tests")
          git commit -m "$BUILD_MSG [skip ci]" || exit 0
          git push origin main
